<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Molecule Builder</title>

  <!-- Local libraries. Run DOWNLOAD_LIBRARIES_ONCE.bat first. -->
  <script src="libs/aframe.min.js"></script>
  <script src="libs/aframe-ar.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="panel">
    <h2>AR Molecule Builder</h2>
    <select id="molecule">
      <option value="H2O">H₂O – Water</option>
      <option value="CO2">CO₂ – Carbon Dioxide</option>
      <option value="CH4">CH₄ – Methane</option>
      <option value="NH3">NH₃ – Ammonia</option>
      <option value="O2">O₂ – Oxygen</option>
    </select>
    <button onclick="buildMolecule()">Build Molecule</button>
    <button onclick="resetMolecule()">Reset</button>
    <p id="message">Point the camera at the Hiro marker.</p>
    <p id="fact"></p>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-marker preset="hiro" id="marker">
      <a-entity id="moleculeGroup"></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script src="app.js"></script>
</body>
</html>
